<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Type Prediction</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1> Room Type Prediction</h1>
            <p>Enter Airbnb listing details to predict the room type</p>
        </div>

        <form id="predictionForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="latitude">Latitude</label>
                    <input
                        type="number"
                        id="latitude"
                        step="any"
                        min="-90"
                        max="90"
                        placeholder="e.g. 40.7128"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="longitude">Longitude</label>
                    <input
                        type="number"
                        id="longitude"
                        step="any"
                        min="-180"
                        max="180"
                        placeholder="e.g. -74.0060"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="price">Price per Night</label>
                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="any"
                        placeholder="e.g. 150"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="minimum_nights">Minimum Nights</label>
                    <input
                        type="number"
                        id="minimum_nights"
                        min="1"
                        max="365"
                        placeholder="e.g. 2"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="number_of_reviews">Number of Reviews</label>
                    <input
                        type="number"
                        id="number_of_reviews"
                        min="0"
                        placeholder="e.g. 25"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="reviews_per_month">Reviews per Month</label>
                    <input
                        type="number"
                        id="reviews_per_month"
                        min="0"
                        step="any"
                        placeholder="e.g. 2.5"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="calculated_host_listings_count">
                        Host Listings Count
                    </label>
                    <input
                        type="number"
                        id="calculated_host_listings_count"
                        min="0"
                        placeholder="e.g. 3"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="availability_365">Availability (365 Days)</label>
                    <input
                        type="number"
                        id="availability_365"
                        min="0"
                        max="365"
                        placeholder="e.g. 200"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="neighbourhood_group">Neighbourhood Group</label>
                    <input
                        type="text"
                        id="neighbourhood_group"
                        placeholder="e.g. Manhattan"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="neighbourhood">Neighbourhood</label>
                    <input
                        type="text"
                        id="neighbourhood"
                        placeholder="e.g. Harlem"
                        required
                    >
                </div>

            </div>

            <button type="submit" id="predictBtn">
                🔮 Predict Room Type
            </button>

        </form>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Predicting...</p>
        </div>

        <div id="errorBox" class="error hidden"></div>

        <div id="result" class="result hidden">

            <h2>Prediction Result</h2>

            <div class="prediction-card">
                <span>Predicted Room Type</span>
                <strong id="prediction"></strong>
            </div>

            <div class="probability-section">
                <h3>Prediction Probability</h3>
                <div id="probabilityContainer"></div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
